<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="profile-card">

        <div class="profile-image">
            <img src="my_photo.jpg" alt="Profile">
        </div>

        <h1>Sardor</h1>
        <p class="job">Software Engineering Student</p>

        <p class="about">
            Hello! My name is Sardor. I am a Software Engineering
            student and I am learning HTML, CSS and JavaScript.
        </p>

        <div class="info">
            <div>
                <strong>19</strong>
                <span>Age</span>
            </div>

            <div>
                <strong>UZ</strong>
                <span>Country</span>
            </div>

            <div>
                <strong>2</strong>
                <span>Year</span>
            </div>
        </div>

        <button>Contact Me</button>

    </div>

</body>
</html>
